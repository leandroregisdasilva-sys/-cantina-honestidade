{% extends "base.html" %}
{% from "_macros.html" import campo %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="cabecalho-pagina">
  <div>
    <a class="voltar" href="{{ url_for('login') }}">← Voltar para o login</a>
    <h1>Criar conta</h1>
    <p class="subtitulo">Campos com * são obrigatórios.</p>
  </div>
</div>
<form class="cartao formulario" method="post" novalidate data-validar action="{{ url_for('cadastro') }}">
  {% include "_campos_usuario.html" %}
  <div class="rodape-form">
    <a class="botao botao-texto" href="{{ url_for('login') }}">Cancelar</a>
    <button class="botao botao-primario" type="submit">Criar conta</button>
  </div>
</form>
{% endblock %}
